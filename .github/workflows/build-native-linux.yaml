name: Build Linux

on:
  workflow_dispatch:
  workflow_call:

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/native
      - name: Check Rust
        working-directory: packages/native
        run: |
          cargo fmt --check
          cargo clippy --locked --no-default-features --features client -- -D warnings
          cargo clippy --locked --no-default-features --features server -- -D warnings
          cargo test --locked
      - name: Build
        env:
          BUILD_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'continuous' }}
        run: bash tools/ci/native-linux.sh x86_64 "$BUILD_TAG"
      - name: Test Native RPC
        run: node --test packages/native/test/native.test.js
      - uses: actions/upload-artifact@v4
        with:
          name: native-linux-artifact
          path: tmp/build/*.node
          if-no-files-found: error
