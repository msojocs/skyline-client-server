[package]
name = "skyline-native"
version = "1.0.0"
edition = "2021"
rust-version = "1.85"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["client"]
client = []
server = []
# main 层客户端：复用 client 的 RPC 角色（request id 奇偶、超时、drain 语义），只换应用层。
main-client = ["client"]

[dependencies]
napi = { version = "2.16.17", default-features = false, features = ["napi7", "dyn-symbols", "compat-mode"] }
napi-derive = "2.16.13"
serde_json = "1.0"

[profile.release]
lto = "thin"
strip = "symbols"
